site_name: Lanxang
site_description: "Self-hosted watchdog for your home network: every device, every cable, every change. Alerts included, cloud not required."
repo_url: https://github.com/Cyb3rRon1n/lanxang
repo_name: Cyb3rRon1n/lanxang
site_url: https://cyb3rron1n.github.io/lanxang/
edit_uri: edit/main/docs/

theme:
  name: material
  font: false
  logo: images/brand/mark-dark.svg
  favicon: images/brand/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.action.edit
    - content.code.copy

extra_css:
  - stylesheets/lanxang.css

nav:
  - Home: index.md
  - Getting started: getting-started/index.md
  - Supported hardware: hardware.md
  - Configuration: configuration.md
  - CLI reference: cli-reference.md
  - Deployment: deployment/index.md
  - Development:
      - Architecture: architecture/index.md
      - Service catalog: service-catalog.md
      - Roadmap: roadmap.md
      - Design notes: development/design-notes.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
