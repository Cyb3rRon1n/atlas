[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-homelab"
version = "0.4.0"
description = "AI-powered operations platform for self-hosted infrastructure."
readme = "README.md"
requires-python = ">=3.11"

authors = [
{name = "Atlas Contributors"}
]

license = {file = "LICENSE"}

keywords = [
"homelab",
"ai",
"automation",
"docker",
"proxmox",
"infrastructure",
"self-hosting"
]

classifiers = [
"Development Status :: 3 - Alpha",
"Intended Audience :: System Administrators",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Operating System :: POSIX :: Linux",
"Topic :: System :: Systems Administration"
]

dependencies = [
    "typer",
    "rich",
    "pydantic",
    "psutil",
    "pyyaml",
    "docker",
    "proxmoxer",
    "anthropic",
    "requests",
    "sqlalchemy"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
docs = ["mkdocs-material"]

[project.urls]
Homepage = "https://github.com/Cyb3rRon1n/atlas"
Repository = "https://github.com/Cyb3rRon1n/atlas"
Documentation = "https://cyb3rron1n.github.io/atlas/"
"Issue Tracker" = "https://github.com/Cyb3rRon1n/atlas/issues"

[project.scripts]
atlas = "atlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

