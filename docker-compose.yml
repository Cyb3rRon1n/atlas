name: atlas

# Atlas is not a daemon (see CLAUDE.md) - `atlas` runs the read-only
# `atlas web` dashboard; nothing inside it refreshes data on its own.
#
#   cp atlas.yaml.example atlas.yaml   # edit: Proxmox/Prometheus/AI config
#   docker compose up -d               # pulls ghcr.io/cyb3rron1n/atlas (or builds it)
#   docker compose exec atlas atlas discover
#
# atlas-scan (below) keeps the device inventory and network map fresh - the
# explicit, visible equivalent of a host cron line, for stacks without one.

x-atlas: &atlas
  image: ghcr.io/cyb3rron1n/atlas:${ATLAS_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  volumes:
    - ./atlas.yaml:/data/atlas.yaml:ro
    - data:/data/inventory
    - reports:/data/reports
    - logs:/data/logs
    # Needed only for `atlas discover`'s Docker plugin / the network map /
    # restart|stop|resize commands. Comment out if you don't need
    # container-level insight - mounting this socket at all is
    # root-equivalent host access; a `:ro` mount flag does not restrict
    # what can be done over the socket itself.
    - /var/run/docker.sock:/var/run/docker.sock

services:
  atlas:
    <<: *atlas
    ports:
      - "${ATLAS_PORT:-8420}:8420"

  # Finds every device on the LAN and refreshes discover / Proxmox / map every
  # ATLAS_SCAN_MINUTES (default 15). Host networking is what lets it see the
  # LAN's MAC addresses (it reads the host's ARP table); it needs no extra
  # capabilities. Writes the same database the atlas web container reads.
  atlas-scan:
    <<: *atlas
    network_mode: host
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ATLAS_SCAN_MINUTES: ${ATLAS_SCAN_MINUTES:-15}
    healthcheck:
      disable: true
    command:
      - sh
      - -c
      - |
        while :; do
          atlas scan
          atlas discover >/dev/null 2>&1
          atlas proxmox scan >/dev/null 2>&1
          atlas map >/dev/null 2>&1 && echo "$$(date -u +%FT%TZ) map refreshed"
          sleep "$${ATLAS_SCAN_MINUTES:-15}m"
        done

volumes:
  data:
  reports:
  logs:
