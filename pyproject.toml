[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lanxang"
version = "1.2.0"
description = "Self-hosted watchdog for your home network: every device, every cable, every change. Alerts included, cloud not required."
readme = "README.md"
requires-python = ">=3.11"

authors = [
{name = "Atlas Contributors"}
]

license = {file = "LICENSE"}

keywords = [
"homelab",
"ai",
"automation",
"docker",
"proxmox",
"infrastructure",
"self-hosting"
]

classifiers = [
"Development Status :: 3 - Alpha",
"Intended Audience :: System Administrators",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Operating System :: POSIX :: Linux",
"Topic :: System :: Systems Administration"
]

dependencies = [
    "typer",
    "rich",
    "pydantic",
    "psutil",
    "pyyaml",
    "docker",
    "proxmoxer",
    "anthropic",
    "requests",
    "sqlalchemy",
    "paramiko",
    "maxminddb",
    "websocket-client",         # TrueNAS: its API is JSON-RPC over a websocket
    "tzdata>=2024.1"            # display.time_zone: IANA zones even where the OS has none (slim images, Windows)
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "apprise>=1.9"]   # apprise: so CI runs the real Apprise test
docs = ["mkdocs-material"]
alerts = ["apprise>=1.9"]   # notify.apprise URLs; the Docker image installs it

[project.urls]
Homepage = "https://github.com/Cyb3rRon1n/lanxang"
Repository = "https://github.com/Cyb3rRon1n/lanxang"
Documentation = "https://cyb3rron1n.github.io/lanxang/"
"Issue Tracker" = "https://github.com/Cyb3rRon1n/lanxang/issues"

[project.scripts]
lanxang = "lanxang.cli:app"
atlas = "lanxang.cli:legacy"

[tool.hatch.build.targets.wheel]
packages = ["lanxang"]

