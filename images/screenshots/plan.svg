<svg xmlns="http://www.w3.org/2000/svg" width="980" height="594" viewBox="0 0 980 594">
<rect width="980" height="594" rx="12" fill="#0d1b2a"/>
<path d="M0,12 a12,12 0 0 1 12,-12 h956 a12,12 0 0 1 12,12 v34 h-980 z" fill="#16283b"/>
<line x1="0" y1="46" x2="980" y2="46" stroke="#233649" stroke-width="1"/>
<circle cx="26" cy="23.0" r="7" fill="#e0645a" opacity="0.85"/>
<circle cx="48" cy="23.0" r="7" fill="#e0b04a" opacity="0.85"/>
<circle cx="70" cy="23.0" r="7" fill="#5fb87a" opacity="0.85"/>
<text x="490.0" y="28.0" text-anchor="middle" font-family="JetBrains Mono" font-size="15" fill="#8a99a2">atlas analyze</text>
<text x="24" y="84" font-family="JetBrains Mono" font-size="20" fill="#5cb3c4" xml:space="preserve">Atlas Analysis</text>
<text x="24" y="144" font-family="JetBrains Mono" font-size="20" fill="#dbe3e6" xml:space="preserve">sonarr and radarr are both healthy individually, but radarr's last</text>
<text x="24" y="174" font-family="JetBrains Mono" font-size="20" fill="#dbe3e6" xml:space="preserve">import failed because sonarr was holding a file lock it needed.</text>
<text x="24" y="234" font-family="JetBrains Mono" font-size="20" fill="#5cb3c4" xml:space="preserve">Suggested plan: Recover the media stack</text>
<text x="24" y="294" font-family="JetBrains Mono" font-size="20" fill="#dbe3e6" xml:space="preserve">  1. atlas stop sonarr</text>
<text x="24" y="324" font-family="JetBrains Mono" font-size="20" fill="#66757f" xml:space="preserve">     (sonarr is holding a lock radarr needs)</text>
<text x="24" y="384" font-family="JetBrains Mono" font-size="20" fill="#dbe3e6" xml:space="preserve">  2. atlas restart radarr</text>
<text x="24" y="414" font-family="JetBrains Mono" font-size="20" fill="#66757f" xml:space="preserve">     (will pick up cleanly once sonarr is stopped)</text>
<text x="24" y="474" font-family="JetBrains Mono" font-size="20" fill="#dbe3e6" xml:space="preserve">  3. atlas restart sonarr</text>
<text x="24" y="504" font-family="JetBrains Mono" font-size="20" fill="#66757f" xml:space="preserve">     (safe to bring back up once the lock is cleared)</text>
<text x="24" y="564" font-family="JetBrains Mono" font-size="20" fill="#dbe3e6" xml:space="preserve">Run each step yourself, in order.</text>
</svg>
