name: atlas

# Atlas is not a daemon (see CLAUDE.md) - `atlas` runs the read-only
# `atlas web` dashboard; nothing inside it refreshes data on its own.
#
#   cp atlas.yaml.example atlas.yaml   # edit: Proxmox/Prometheus/AI config
#   docker compose up -d               # pulls ghcr.io/cyb3rron1n/atlas (or builds it)
#   docker compose exec atlas atlas discover
#
# Optional: `docker compose --profile refresh up -d` adds atlas-refresh, a
# second container from the same image that just re-runs discover / proxmox
# scan / map every ATLAS_REFRESH_MINUTES (default 30) - the explicit,
# visible equivalent of a host cron line, for stacks without one.

x-atlas: &atlas
  image: ghcr.io/cyb3rron1n/atlas:${ATLAS_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  volumes:
    - ./atlas.yaml:/data/atlas.yaml:ro
    - data:/data/inventory
    - reports:/data/reports
    - logs:/data/logs
    # Needed only for `atlas discover`'s Docker plugin / the network map /
    # restart|stop|resize commands. Comment out if you don't need
    # container-level insight - mounting this socket at all is
    # root-equivalent host access; a `:ro` mount flag does not restrict
    # what can be done over the socket itself.
    - /var/run/docker.sock:/var/run/docker.sock

services:
  atlas:
    <<: *atlas
    ports:
      - "${ATLAS_PORT:-8420}:8420"

  atlas-refresh:
    <<: *atlas
    profiles: [refresh]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ATLAS_REFRESH_MINUTES: ${ATLAS_REFRESH_MINUTES:-30}
    healthcheck:
      disable: true
    command:
      - sh
      - -c
      - |
        while :; do
          atlas discover >/dev/null 2>&1
          atlas proxmox scan >/dev/null 2>&1
          atlas map >/dev/null 2>&1 && echo "$$(date -u +%FT%TZ) map refreshed"
          sleep "$${ATLAS_REFRESH_MINUTES:-30}m"
        done

volumes:
  data:
  reports:
  logs:
